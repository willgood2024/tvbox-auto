name: Update TVBox Sources
on:
  schedule:
    - cron: "0 16 * * *"   # UTC 16:00 = 北京时间 00:00，每日执行
  workflow_dispatch:        # 支持在 GitHub 网页手动点一下立即运行
permissions:
  contents: write           # 允许 Action 把生成的文件推回仓库
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run collector
        run: python collect.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tvbox.json tvbox_storehouse.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: update tvbox sources $(date -u +%Y-%m-%d)"
            git push
          fi
