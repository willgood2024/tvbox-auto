name: Update TVBox Sources
on:
  schedule:
    - cron: "0 16 * * *"   # UTC 16:00 = 北京时间 00:00，每日执行
  workflow_dispatch:        # 支持在 GitHub 网页手动点一下立即运行
permissions:
  contents: write           # 允许 Action 把生成的文件推回仓库
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Generate sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          LC_ALL: "C.UTF-8"
          LANG: "C.UTF-8"
        run: python3 collect.py
      - name: Commit & push
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tvbox.json tvbox_storehouse.json
          echo "### git status"; git status --short
          echo "### staged diff (stat)"; git diff --cached --stat
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "auto: update tvbox sources $(date -u +%Y-%m-%d)"
          echo "### pushing origin HEAD:main"
          if git push origin HEAD:main; then
            echo "推送成功"
          else
            echo "::error::git push 失败。最常见原因：1) Settings→Actions→General 中 Workflow permissions 被设为 Read-only（需改为 Read and write）；2) main 分支开了分支保护 Require a pull request（需允许 github-actions[bot] 绕过，或改用非保护分支）。"
            exit 1
          fi
